; Everything PostHog needs runs inside this one container, started in dependency order by priority.
;
; 5-13  storage and infrastructure: proxy, ClickHouse (with embedded Keeper), Redpanda, SeaweedFS
; 20    init: waits for the infrastructure, creates buckets and topics, runs migrations (once)
; 30+   PostHog services; each waits for /run/posthog/initialized (bin/svc.sh) before it starts
;
; Logs go to the container's stdout/stderr so they show up in the Cloudron app log.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:caddy]
priority=5
command=/usr/bin/caddy run --config /run/posthog/Caddyfile --adapter caddyfile
environment=XDG_CONFIG_HOME="/tmp/caddy",XDG_DATA_HOME="/tmp/caddy"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:clickhouse]
priority=10
command=/usr/bin/clickhouse server --config-file=/etc/clickhouse-server/config.xml
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redpanda]
priority=11
; Single node, one core, 1 GiB, no overcommissioning: this shares a container with everything else.
command=/usr/bin/redpanda --redpanda-cfg /run/posthog/redpanda.yaml --overprovisioned --smp 1 --memory 1G --reserve-memory 0M
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:seaweedfs]
priority=12
command=/usr/bin/weed server -dir=/var/lib/posthog/objectstorage -ip=127.0.0.1 -master.port=19001 -master.volumePreallocate=false -s3 -s3.port=19000 -volume.max=1000
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:seaweedfs-s3-replay]
priority=13
; The replay-blob S3 endpoint: upstream runs a second SeaweedFS for it (port 8333), here it is a
; second gateway onto the same master.
command=/usr/bin/weed s3 -ip=127.0.0.1 -port=8333 -master=127.0.0.1:19001
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:init]
priority=20
; One-shot: waits for Postgres/Redis/ClickHouse/Kafka/S3, creates the buckets and topics, runs the
; migrations, then touches /run/posthog/initialized. On a restart it runs again and is a no-op.
command=/app/code/bin/init.sh
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
priority=30
command=/app/code/bin/svc.sh web ./bin/docker-server
directory=/code
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
priority=31
command=/app/code/bin/svc.sh worker ./bin/docker-worker-celery --with-scheduler
directory=/code
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:capture]
priority=32
command=/app/code/bin/svc.sh capture /usr/local/bin/capture
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:replay-capture]
priority=33
command=/app/code/bin/svc.sh replay-capture /usr/local/bin/capture
